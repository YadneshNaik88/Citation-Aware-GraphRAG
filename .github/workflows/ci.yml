name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies via make setup
        run: make setup

      - name: Run code linting
        run: make lint

      - name: Run test suite
        run: make test

      - name: Run leakage audit skeleton
        run: make leakage

      - name: Generate environment report
        run: make env-report
